name: Publish inspected distributions

# This workflow is inert until it is committed to GitHub, its environments are protected,
# and matching Trusted Publishers are configured separately on TestPyPI/PyPI. It never builds.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index selected for this explicit rehearsal or release
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      ci_run_id:
        description: Successful CI workflow run that produced the inspected distributions
        required: true
        type: string
      commit_sha:
        description: Full commit SHA used in the CI artifact name and dispatch ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cernora-publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish-testpypi:
    if: inputs.target == 'testpypi' && github.sha == inputs.commit_sha
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require a successful CI run for this exact commit
        shell: bash
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          test "$(jq -r .name <<<"$run_json")" = CI
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/ci.yml
          test "$(jq -r .event <<<"$run_json")" = push
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = "$EXPECTED_SHA"
      - name: Download the inspected CI distributions without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cernora-dist-${{ inputs.commit_sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Require one matching Cernora wheel and source archive
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'cernora-*-py3-none-any.whl' -print)
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name 'cernora-*.tar.gz' -print)
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1
          wheel_name="$(basename "${wheels[0]}")"
          version="${wheel_name#cernora-}"
          version="${version%-py3-none-any.whl}"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+]*$ ]]
          test "$(basename "${sdists[0]}")" = "cernora-${version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum dist/*
      - name: Publish to TestPyPI through OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true

  publish-pypi:
    if: >-
      inputs.target == 'pypi' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.sha == inputs.commit_sha
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require a successful CI run for this exact commit
        shell: bash
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          test "$(jq -r .name <<<"$run_json")" = CI
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/ci.yml
          test "$(jq -r .event <<<"$run_json")" = push
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = "$EXPECTED_SHA"
      - name: Download the inspected CI distributions without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cernora-dist-${{ inputs.commit_sha }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Require one matching Cernora wheel and source archive
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'cernora-*-py3-none-any.whl' -print)
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name 'cernora-*.tar.gz' -print)
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1
          wheel_name="$(basename "${wheels[0]}")"
          version="${wheel_name#cernora-}"
          version="${version%-py3-none-any.whl}"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+]*$ ]]
          test "$(basename "${sdists[0]}")" = "cernora-${version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum dist/*
      - name: Require the production tag to match the artifact version
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ steps.artifacts.outputs.version }}
        run: test "$GITHUB_REF" = "refs/tags/v${ARTIFACT_VERSION}"
      - name: Publish to production PyPI through OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
